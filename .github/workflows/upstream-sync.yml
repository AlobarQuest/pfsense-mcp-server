name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/gensecaihq/pfsense-mcp-server.git || true
          git fetch upstream --tags

      - name: Check for new stable release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upstream cuts semver releases (vX.Y.Z). Track the latest non-prerelease.
          TAG=$(gh api repos/gensecaihq/pfsense-mcp-server/releases/latest --jq .tag_name) || { echo "No stable upstream release found — nothing to do."; echo "has_changes=false" >> $GITHUB_OUTPUT; exit 0; }
          # Current fork version = pyproject.toml version (upstream bumps it per release).
          CURRENT="v$(grep -m1 -E '^version[[:space:]]*=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          case "$CURRENT" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Could not parse fork version from pyproject.toml (got: $CURRENT)"; exit 1 ;;
          esac
          echo "Latest upstream stable: ${TAG} — fork main: ${CURRENT}"
          if [ "$TAG" = "$CURRENT" ]; then
            echo "Fork is up to date — nothing to do."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Create or reset sync branch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git checkout -B upstream-sync "${{ steps.check.outputs.tag }}"
          # Fork owns .github entirely — drop upstream CI, restore ours
          rm -rf .github
          git checkout origin/main -- .github/
          git add -A .github
          git diff --cached --quiet || git commit -m "ci: replace upstream CI with fork sync workflow"
          git push origin upstream-sync --force

      - name: Run pip-audit (best-effort)
        if: steps.check.outputs.has_changes == 'true'
        run: |
          python -m pip install --upgrade pip pip-audit
          set +e
          # Audit the declared dependency set without installing/running anything.
          pip-audit -r requirements.txt > /tmp/pip_audit.txt 2>&1
          echo "pip-audit exit code: $?" >> /tmp/pip_audit.txt
          set -e
          tail -100 /tmp/pip_audit.txt

      - name: Generate AI security review
        if: steps.check.outputs.has_changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_REF: origin/main
          HEAD_REF: ${{ steps.check.outputs.tag }}
        run: python3 .github/scripts/ai_security_review.py

      - name: Open or update PR
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          COMMITS=$(git log origin/main.."$TAG" --oneline -- . ':!.github' | head -80)
          RELEASE_NOTES=$(gh api "repos/gensecaihq/pfsense-mcp-server/releases/tags/${TAG}" --jq .body 2>/dev/null | head -80)

          {
            printf '## Upstream Sync — %s\n\n' "$TAG"
            printf '**Upstream release notes ([gensecaihq/pfsense-mcp-server](https://github.com/gensecaihq/pfsense-mcp-server/releases)):**\n%s\n\n' "$RELEASE_NOTES"
            printf '**Commits (first 80):**\n```\n%s\n```\n\n---\n\n' "$COMMITS"
            printf '## 🤖 AI Security Review\n\n'
            cat /tmp/ai_review.md
            printf '\n\n---\n\n## 🔒 pip-audit\n\n```\n'
            tail -100 /tmp/pip_audit.txt 2>/dev/null || echo "(pip-audit not run)"
            printf '```\n\n---\n\n'
            printf '**After merging, update the local runtime clone:**\n'
            printf '```\ngit -C ~/Developer/pfsense-mcp-server checkout main \\\n'
            printf '  && git pull --ff-only \\\n'
            printf '  && ~/Developer/pfsense-mcp-server/.venv/bin/pip install -r requirements.txt\n```\n\n'
            printf '*Auto-generated by upstream-sync workflow*\n'
          } > /tmp/pr_body.md

          EXISTING=$(gh pr list --repo "${{ github.repository }}" --base main --head upstream-sync --json number --jq '.[0].number' 2>/dev/null)

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh pr edit "$EXISTING" --repo "${{ github.repository }}" \
              --title "⬆️ Upstream sync — ${TAG}" \
              --body-file /tmp/pr_body.md
            echo "Updated existing PR #${EXISTING}"
          else
            gh pr create --repo "${{ github.repository }}" \
              --base main \
              --head upstream-sync \
              --title "⬆️ Upstream sync — ${TAG}" \
              --body-file /tmp/pr_body.md
          fi
